# /etc/nginx/sites-available/propertyselection.itb2bhost.ru
# Сертификат: sudo certbot --nginx -d propertyselection.itb2bhost.ru
server {
    listen 80;
    server_name propertyselection.itb2bhost.ru;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name propertyselection.itb2bhost.ru;

    ssl_certificate     /etc/letsencrypt/live/propertyselection.itb2bhost.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propertyselection.itb2bhost.ru/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
