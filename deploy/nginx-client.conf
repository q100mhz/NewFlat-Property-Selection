# /etc/nginx/sites-available/newflat72.itb2bhost.ru.conf
# Адрес для клиентов: здесь открываются только страницы подборок, всё остальное — 404.
# После установки certbot (--nginx) сам добавит блок HTTPS и редирект с HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name newflat72.itb2bhost.ru;

    client_max_body_size 1m;

    # страница подборки, её API, фото и статика клиентской страницы
    location ~ ^/(s/|api/public/|img$|static/client/|static/shared/) {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
    location / { return 404; }
}
